<h1>台灣雲端書庫 ISBN 清單</h1>
<div class="note"><ol>
<li>點 ISBN 或書名關鍵字就會複製，貼到 App 搜尋欄。</li>
<li>先按「試閱」（可看全書 1/10，不佔額度）判斷適不適合，再決定要不要「借閱」。國臺圖一次只能借 6 本，省著用。</li>
<li>ISBN 取自國圖館藏目錄；標「需核對版本」的是書名相符但版本未確認，試閱時看版權頁。</li>
<li>右邊勾「有」「沒有」會記在這支手機上，方便下次接著找。</li>
<li>不佔國臺圖額度的其他管道（免費線上、其他館電子書、實體館）另外整理中，完成後更新到這一頁。</li>
</ol></div>

let st={};try{st=JSON.parse(localStorage.getItem('ebk')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('ebk',JSON.stringify(st))}catch(e){}};
const F=[['all','全部'],['isbn','有 ISBN'],['kw','只能用書名搜'],['todo','還沒查'],['yes','App 有']];let cur='all';
function copy(el,txt){navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>{el.classList.add('ok');setTimeout(()=>el.classList.remove('ok'),900)}).catch(()=>{})}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function card(r){const s=st[r.id]||'';
 const ib=r.isbn.map(i=>`<span class="isbn" data-c="${i}">${i}</span>`).join('');
 return `<div class="card ${r.got?'got':''}"><label class="chk"><select data-id="${r.id}"><option value="">未查</option><option value="yes"${s=='yes'?' selected':''}>有</option><option value="no"${s=='no'?' selected':''}>沒有</option></select></label>
 <div class="t">${r.pri?'<span class="stars">'+'★'.repeat(r.pri)+'</span>':''}${esc(r.title)}</div>
 ${r.meta?`<div class="m">${esc(r.meta)}</div>`:''}${r.got?`<div class="m">已取得：${esc(r.got)}</div>`:''}
 <div>${ib}<span class="isbn kw" data-c="${esc(r.kw)}">${esc(r.kw)}</span></div>
 ${r.conf&&r.conf!='索書號相符'?`<div class="warn">${esc(r.conf)}</div>`:''}</div>`}
function render(){document.getElementById('tabs').innerHTML=F.map(([k,n])=>`<button data-k="${k}" class="${k==cur?'on':''}">${n}</button>`).join('');
 let L=R.filter(r=>cur=='all'||(cur=='isbn'&&r.isbn.length)||(cur=='kw'&&!r.isbn.length)||(cur=='todo'&&!st[r.id])||(cur=='yes'&&st[r.id]=='yes'));
 L.sort((a,b)=>(!!a.got-!!b.got)||(b.pri-a.pri)||(b.isbn.length>0)-(a.isbn.length>0));

document.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b){cur=b.dataset.k;render();return}

document.addEventListener('change',e=>{const s=e.target.closest('select[data-id]');if(s){st[s.dataset.id]=s.value;save()}});
render();
